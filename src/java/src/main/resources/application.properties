# Spring Boot Configuration
server.port=8080
spring.application.name=capella-diagram-service

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.root=INFO
logging.level.org.polarsys.capella=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Application info
info.app.name=Capella Diagram Service
info.app.description=TDD GREEN Phase - Mock implementation with in-memory diagram tracking
info.app.version=1.0.0
info.app.phase=GREEN
info.app.java.version=11