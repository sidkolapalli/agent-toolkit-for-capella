name: build

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The build is tested with Maven 3.9.11; the runner's default Maven failed to resolve Tycho 2.7.5's dependencies.
      - name: Maven 3.9.11
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.11/binaries/apache-maven-3.9.11-bin.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.11/bin" >> "$GITHUB_PATH"
      - name: Fetch the bundled Codex runtime
        run: python scripts/fetch-codex.py
      - name: Build and test
        env:
          JAVA_TOOL_OPTIONS: >-
            -Djdk.xml.maxGeneralEntitySizeLimit=0 -Djdk.xml.totalEntitySizeLimit=0 -Djdk.xml.entityExpansionLimit=0
        run: |
          mvn -v
          xvfb-run -a mvn -B -e -f plugins clean verify
