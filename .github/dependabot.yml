# Monthly, one grouped pull request per ecosystem. The Capella target platform (p2), MANIFEST.MF
# and the Codex pins in provenance.json are outside Dependabot's reach and stay manual.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: maven
    directory: /plugins
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      maven:
        patterns: ["*"]
    ignore:
      # Tycho 2.7.x is the line that builds against Capella 7.0
      - dependency-name: "org.eclipse.tycho:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
