# Monthly, one grouped pull request for the GitHub Actions. Maven is left out: the reactor
# (plugins/pom.xml) includes ../releng/capella-target, which Dependabot cannot read, and its
# versions (Tycho 2.7.5, the Capella target platform, MANIFEST.MF, the Codex pins in
# provenance.json) are pinned to Capella 7.0 and updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
